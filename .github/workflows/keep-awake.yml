name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 0 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase health
        run: |
          curl -s -o /dev/null -w "supabase ping: %{http_code}\n" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            https://fuygtaegkczrzmivfcfl.supabase.co/auth/v1/health